services:
  - type: web
    name: tizly-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: tizly-media
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: ADMIN_REGISTRATION_CODE
        value: TIZLY_ADMIN_2026
